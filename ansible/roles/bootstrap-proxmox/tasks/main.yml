# ======================================================================================== #
# ROLE: Proxmox [BOOTSTRAP]
# Used to bootstrap new Proxmox nodes and configure service accounts.
# Note: Apply to Proxmox nodes already joined to cluster.
# ======================================================================================== #
---
- name: "Install Required Packages"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ pve_required_packages }}"

- name: "Configure Service Accounts"
  ansible.builtin.import_tasks: pve-service-accounts.yml
  when: enable_task_service_accounts # true/false: Set in 'defaults.yml' for role.

- name: "Configure VM Template"
  ansible.builtin.import_tasks: pve-vm-template.yml
  when: enable_task_vm_template # true/false: Set in 'defaults.yml' for role.
