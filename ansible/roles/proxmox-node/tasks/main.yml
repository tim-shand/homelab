# ================================================== #
# ROLE: Proxmox Node [BOOTSTRAP]
# Used to bootstrap new Proxmox nodes.
# - Apply to Proxmox nodes already joined to cluster.
# ================================================== #
---
- name: "Ping Host"
  ansible.builtin.ping:

- name: Create Service Accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: "{{ item.state }}" # present / absent
    groups: "{{ item.groups }}"
    append: yes
    shell: /bin/bash
    create_home: yes
  loop: "{{ service_accounts_local }}"

- name: Print SSH Public Key Location
  ansible.builtin.debug:
    var: ssh_key_path

- name: Deploy SSH Public Keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ ssh_key_path }}/{{ item.name }}.ssh.pub"
  loop: "{{ service_accounts_local }}"

- name: Configure Passwordless Sudo Privilege
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL"
    dest: "/etc/sudoers.d/{{ item.name }}"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ service_accounts_local }}"
