---
# COMMON PACKAGES --------------------------------------------------- #
# Define package names to be installed (common across distributions).
common_packages:
  - sudo
  - git
  - nano
  - curl
  - wget
  - htop

# Define in group_vars file.
required_packages:
  - sudo

# SSH KEY FILES  --------------------------------------------------- #
# Path to SSH key file directory.
ssh_key_path: "../../../files/ssh_keys"

# SERVICE ACCOUNTS --------------------------------------------------- #
# List service accounts to be configured, including group memberships.
service_accounts_local:
  - name: "svc-ansible"
    groups: "sudo"
    state: "present" # present / absent
