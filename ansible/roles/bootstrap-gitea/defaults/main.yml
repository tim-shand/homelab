---
# Default ----------------------------------------- #
enable_task_gitea_vm: true
enable_task_gitea_server: false
enable_task_gitea_runner: false

# Gitea VM
pve_template_id: "9000"
gitea_vm_id: "200"
gitea_vm_name: "svr-mgt-gitea-dev"
gitea_vm_desc: "Management: Git Server (Gitea)"
gitea_vm_tags: "management"
gitea_vm_network_bridge: "vmbr1"
gitea_vm_network_vlan: "20"
gitea_vm_network_ipv4: "10.0.20.10/24"
gitea_vm_network_gw: "10.0.20.254"
gitea_vm_network_nameserver: "10.0.20.254"
gitea_vm_compute_cores: "4"
gitea_vm_compute_mem: "2048"

# Gitea Server
gitea_version: "1.27.3"
gitea_user: gitea
gitea_group: gitea
gitea_home: /home/gitea
gitea_data_dir: /var/lib/gitea
gitea_config_dir: /etc/gitea
gitea_binary_path: /usr/local/bin/gitea
gitea_domain: "git.tshand.net"
gitea_http_port: 8080
gitea_ssh_port: 2222 # Gitea SSH server for git operations, kept on separate port from default.
gitea_admin_un: "gitadmin"
gitea_admin_pw: "changeme123"
gitea_admin_em: "gitadmin@localhost"

# Gitea Runner
runner_version: "3.3.1"
runner_user: "gitea-runner"
runner_group: "gitea-runner"
runner_home: /var/lib/gitea-runner
runner_binary_path: /usr/local/bin/gitea-runner
runner_name: "gitea-runner-local"
runner_instance: "http://10.0.20.10:8080"
