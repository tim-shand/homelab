# ======================================================================================== #
# PLAYBOOK: Gitea [BOOTSTRAP]
# Bootstrap a new Gitea server within Proxmox.
# Usage: ansible-playbook -i inventory/main.ini playbooks/bootstrap-gitea.yml --ask-pass
# TIP: Purge the previously stored host key from known hosts and add the new host key.
#    ssh-keygen -R "10.0.20.10" &> /dev/null && ssh-keyscan -H "10.0.20.10" >> ~/.ssh/known_hosts
# ======================================================================================== #

---
- name: "Proxmox: Deploy Gitea VM"
  hosts: "{{ groups['proxmox_nodes'][0] }}" # Run on first node in group.
  become: true
  remote_user: root # Requires `--ask-pass` flag during command execution.
  gather_facts: true # Collects detailed information about target systems to enable dynamic behavior in playbooks.

  vars:
    pve_template_id: "9000"
    gitea_vm_id: "200"
    gitea_vm_name: "svr-mgt-gitea-dev"
    gitea_vm_desc: "Management: Git Server (Gitea)"
    gitea_vm_tags: "management"
    gitea_vm_network_bridge: "vmbr1"
    gitea_vm_network_vlan: "20"
    gitea_vm_network_ipv4: "10.0.20.10/24"
    gitea_vm_network_gw: "10.0.20.254"
    gitea_vm_network_namerserver: "10.0.20.254"
    gitea_vm_compute_cores: "4"
    gitea_vm_compute_mem: "2048"

  tasks:
    - name: "Cleanup Existing VM"
      ansible.builtin.shell: |
        qm stop "{{ gitea_vm_id }}" &> /dev/null \
         && sleep 5 \
         && qm destroy "{{ gitea_vm_id }}" --purge 1 --destroy-unreferenced-disks 1 &> /dev/null \
         && sleep 5

    - name: "Gitea VM: Clone Template"
      ansible.builtin.shell: |
        qm clone "{{ pve_template_id }}" "{{ gitea_vm_id }}" --name "{{ gitea_vm_name }}" --description "{{ gitea_vm_desc }}" --full

    - name: "Gitea VM: Configure Hardware"
      ansible.builtin.shell: |
        qm set "{{ gitea_vm_id }}" --tags "{{ gitea_vm_tags }}" --ostype l26 --agent 1 --cpu host \
         --cores "{{ gitea_vm_compute_cores }}" --memory {{ gitea_vm_compute_mem }} --balloon 0 \
         --net0 virtio,bridge="{{ gitea_vm_network_bridge }}",tag="{{ gitea_vm_network_vlan }}" --autostart 1 --onboot 1

    - name: "Gitea VM: Configure Networking"
      ansible.builtin.shell: |
        qm set "{{ gitea_vm_id }}" --ipconfig0 ip="{{ gitea_vm_network_ipv4 }}",gw="{{ gitea_vm_network_gw }}" \
          --nameserver "{{ gitea_vm_network_namerserver }}"

    - name: "Check VM Status"
      ansible.builtin.shell: qm status "{{ gitea_vm_id }}"
      register: gitea_vm_status

    - name: "Start Gitea VM"
      ansible.builtin.shell: qm start "{{ gitea_vm_id }}"
      when: gitea_vm_status.rc == 0
