# ======================================================================================== #
# PLAYBOOK: Proxmox [BOOTSTRAP]
# Used to bootstrap new Proxmox nodes and configure service accounts.
# - Apply to Proxmox nodes already joined to cluster.
# Usage: ansible-playbook -i inventory/main.ini playbooks/proxmox-bootstrap.yml --ask-pass
# ======================================================================================== #

---
# Initial Setup: Install updates, required packages, configure Ansible service account.
- name: "Proxmox: Initial Setup (All Nodes)"
  hosts: proxmox_nodes # Run on all Proxmox nodes.
  become: true
  remote_user: root # Requires `--ask-pass` flag during command execution.
  gather_facts: true # Collects detailed information about target systems to enable dynamic behavior in playbooks.
  roles:
    - common
  tasks:
    # Install required packages on all Proxmox nodes.
    - name: Install Required Packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - libguestfs-tools
        - jq

# Bootstrap: Proxmox - Groups, service accounts, API tokens.
- name: "Bootstrap: Proxmox Accounts and Access"
  hosts: "{{ groups['proxmox_nodes'][0] }}" # Run on first node in group.
  become: true
  remote_user: root # Requires `--ask-pass` flag during command execution.
  gather_facts: true # Collects detailed information about target systems to enable dynamic behavior in playbooks.

  vars:
    # Proxmox Groups ----------------------------------------- #
    pve_group_admin_users:
      name: "priv-pve-administrators"
      comment: "Privileged: Proxmox Administrators"
    pve_group_service_accounts:
      name: "priv-svc-automation"
      comment: "Privileged: Automation Service Accounts"

    # Service Accounts ----------------------------------------- #
    service_accounts_pve:
      - name: "svc-ansible@pam"
        comment: "Service Account: Ansible"
      - name: svc-terraform@pve
        comment: "Service Account: Terraform"
      - name: svc-packer@pve
        comment: "Service Account: Packer"

    # API Token ----------------------------------------- #
    api_token_name: "api"

  tasks:
    # Proxmox Groups ----------------------------------------- #
    - name: "Create Proxmox Group (Admin Users)"
      ansible.builtin.shell: |
        pveum group add "{{ pve_group_admin_users.name }}" --comment "{{ pve_group_admin_users.comment }}" &> /dev/null
        pveum aclmod "/" --group "{{ pve_group_admin_users.name }}" --role "Administrator" &> /dev/null

    - name: "Create Proxmox Group (Service Accounts)"
      ansible.builtin.shell: |
        pveum group add "{{ pve_group_service_accounts.name }}" --comment "{{ pve_group_service_accounts.comment }}" &> /dev/null
        pveum aclmod "/" --group "{{ pve_group_service_accounts.name }}" --role "Administrator" &> /dev/null

    # Proxmox Users ----------------------------------------- #
    - name: "Create Proxmox Users (Service Accounts)"
      ansible.builtin.shell: |
        pveum user add "{{ item.name }}" --comment "{{ item.comment }}" &> /dev/null
        pveum user modify "{{ item.name }}" --group "{{ pve_group_service_accounts.name }}" &> /dev/null
      loop: "{{ service_accounts_pve }}"

    # Create service account API token (delete old one first).
    - name: "Create Proxmox API Tokens (Service Accounts)"
      ansible.builtin.shell: |
        pveum user token delete "{{ item.name }}" "{{ api_token_name}}" &> /dev/null
        sleep 2
        pveum user token add "{{ item.name }}" "{{ api_token_name}}" --comment "API Token: {{ now(fmt='%Y%m%d_%H%M%S') }}" --privsep 0 --output-format json
      loop: "{{ service_accounts_pve }}"
      register: shell_output_api_token

    - name: Print API Token Output
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ shell_output_api_token.results }}"
      loop_control:
        label: "{{ item.item }}"

# Bootstrap: Proxmox VM Template ----------------------------------------- #
- name: "Bootstrap: Proxmox VM Template (Ubuntu)"
  hosts: "{{ groups['proxmox_nodes'][0] }}" # Run on first node in group.
  become: true
  remote_user: root # Requires `--ask-pass` flag during command execution.
  gather_facts: true # Collects detailed information about target systems to enable dynamic behavior in playbooks.

  vars:
    ubuntu_dist_name: "resolute"
    ubuntu_dist_version: "2604"
    ubuntu_image_file: "{{ ubuntu_dist_name }}-server-cloudimg-amd64.img"
    ubuntu_image_url: "https://cloud-images.ubuntu.com/{{ ubuntu_dist_name }}/current/{{ ubuntu_image_file }}"
    ubuntu_image_checksum: "8196be9d7958059cb56c6c75c80fdf6cee8a8885bc149ea791d7db1c7ef93035"
    pve_template_id: "9000"
    pve_template_name: "ztmp-ubuntu-server-{{ ubuntu_dist_name }}-{{ ubuntu_dist_version }}"
    pve_template_fs: "16G" # Expand file system to value.
    pve_image_dest_path: "/var/lib/vz/template/iso" # Final destination for image file.
    credentials_path: "../../files/credentials" # Path to credentials directory to save generated passwords.

  tasks:
    - name: "Download Ubuntu Cloud-Init Image"
      ansible.builtin.get_url:
        url: "{{ ubuntu_image_url }}"
        dest: "{{ pve_image_dest_path }}/{{ ubuntu_image_file }}"
        checksum: sha256:"{{ ubuntu_image_checksum }}"
        mode: "0644" # Owner: RW, Group: R, Other: R

    # RUN ONCE TASK:
    # Cannot delete a template created as a linked clone if other VMs or templates still depend on its underlying disk volumes.
    # Must delete or rebase the child clones first. Ok if using full clones.
    - name: "Destroy Existing Template"
      ansible.builtin.shell: qm destroy {{ pve_template_id }} &> /dev/null

    - name: "Generate/Export Password"
      ansible.builtin.set_fact:
        default_password: "{{ lookup('ansible.builtin.password', '/dev/null length=12 chars=ascii_letters,digits') }}"

    # Run provisioning prep tasks: Expand file system, install guest agent, set root password.
    - name: "Prepare Image File"
      ansible.builtin.shell: |
        qemu-img resize "{{ pve_image_dest_path }}/{{ ubuntu_image_file }}" "{{ pve_template_fs }}"
        virt-customize -a "{{ pve_image_dest_path }}/{{ ubuntu_image_file }}" --install qemu-guest-agent
        virt-customize -a "{{ pve_image_dest_path }}/{{ ubuntu_image_file }}" --root-password password:"{{ default_password }}"

    - name: "Deploy Proxmox VM"
      ansible.builtin.shell: |
        qm create "{{ pve_template_id }}" --name "{{ pve_template_name }}" \
          --description "TEMPLATE: Ubuntu Server {{ ubuntu_dist_version }} | root: {{ default_password }}" \
          --tags "template" --ostype l26 --agent 1 --cpu host --sockets 1 --cores 2 --memory 1024 --balloon 0 \
          --bios seabios --boot order=scsi0 --scsihw virtio-scsi-pci \
          --scsi0 local-lvm:0,import-from="{{ pve_image_dest_path }}/{{ ubuntu_image_file }}",backup=0,cache=writeback,discard=on \
          --scsi1 local-lvm:cloudinit --vga virtio --net0 virtio,bridge=vmbr0

    - name: "Check VM Status"
      ansible.builtin.shell: qm status "{{ pve_template_id }}"
      register: pve_vm_status

    - name: "Convert VM to Template"
      ansible.builtin.shell: qm template "{{ pve_template_id }}" && sleep 5
      when: pve_vm_status.rc == 0 # Check return code on VM status command.
