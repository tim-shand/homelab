---
- name: Bootstrap Git VM Installation
  hosts: git # Target the Git server defined in the inventory file.
  vars_files:
    - vars.yaml
  become: true # Use privilege escalation to run tasks as root.
  tasks:
    # Update and upgrade all packages on the server.
    - name: Update Packages
      ansible.builtin.apt:
        update_cache: true # Update the package cache before upgrading.
        upgrade: dist # Upgrade all packages to the latest version.
        cache_valid_time: 3600 # Skips update if run in the last hour.

    - name: Install Required Packages
      ansible.builtin.apt:
        name: "{{ item }}" # Install each package in the required_packages list.
        state: present # Ensure the packages are installed.
      loop: "{{ required_packages }}" # Loop through the list of required packages defined in defaults/main.yaml.

    # UFW: Enable the firewall (disabled by default).
    - name: UFW Enable
      community.general.ufw:
        state: enabled
        policy: allow

    # UFW: Enable UFW logging to monitor firewall activity.
    - name: UFW Logging
      community.general.ufw:
        logging: "{{ ufw_logging }}" # Enable or disable UFW logging based on the variable defined in defaults/main.yaml.

    # UFW: Allow required connections to the server.
    - name: UFW Rules
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop: "{{ ufw_rules }}" # Loop through the list of UFW rules defined in defaults/main.yaml.


